<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contato - LoL Items</title>
    <link rel="stylesheet" href="../css/style.css" />
  </head>

  <body>
    <header>
      <div class="container-header">
        <a href="../index.html">
          <img class="logo" src="../assets/logo-lol.png" alt="logo do lol" />
        </a>

        <nav>
          <ul>
            <li><a href="galeria.html">Galeria</a></li>
            <li><a href="sobre.html">Sobre</a></li>
            <li><a href="contato.html">Contato</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <main>
      <section class="section">
        <h1>Contato</h1>
        <p>Tem dúvidas ou sugestões para nossas aulas? Entre em contato:</p>

        <div class="contato-box">
          <h3>Inscreva-se para participar de nossas aulas de coaching</h3>

          <form>
            <input type="text" placeholder="Seu nome" required />
            <input type="email" placeholder="Seu email" required />
            <textarea placeholder="Sua mensagem" required></textarea>
            <button type="submit">Enviar</button>
          </form>
        </div>
      </section>
    </main>

    <footer>
      <div class="redes-sociais">
        <p>Siga nossas redes sociais:</p>
        <a href="https://linkedin.com" target="_blank"
          ><i class="fab fa-linkedin"><img src="../assets/link.png" alt="" /></i
        ></a>
        <a href="https://instagram.com" target="_blank"
          ><i class="fab fa-instagram"
            ><img src="../assets/insta.png" alt="" /></i
        ></a>
        <a href="https://facebook.com" target="_blank"
          ><i class="fab fa-facebook"><img src="../assets/face.png" alt="" /></i
        ></a>
      </div>
      <p>© 2026 - Projeto Acadêmico de UI/UX</p>
    </footer>
  </body>
</html>
